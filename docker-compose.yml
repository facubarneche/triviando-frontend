services:
  frontend:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - API_URL_SERVER=http://proyecto2025-be-app:8080
      - NEXT_PUBLIC_API_URL_CLIENT=http://localhost:8080
    networks:
      - flashcardsnet

networks:
  flashcardsnet:
    name: flashcardsnet
